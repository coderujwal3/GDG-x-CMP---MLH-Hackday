[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scamsentry"
version = "0.1.0"
description = "Stage 1 deterministic, offline scam-indicator analysis engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScamSentry AI contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scamsentry = "scamsentry.cli:main"

[tool.setuptools.packages.find]
include = ["scamsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
