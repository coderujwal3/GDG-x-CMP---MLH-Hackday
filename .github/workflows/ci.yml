name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-build-isolation -e .

      - name: Run pytest suite
        run: |
          python -m pytest -v

      - name: Run CLI verification (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m scamsentry.cli --help
          scamsentry analyze --text "Your account will be blocked. Verify now."
          scamsentry analyze --file examples/suspicious_message.txt
          scamsentry analyze --file examples/suspicious_message.txt --json

      - name: Run CLI verification (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m scamsentry.cli --help
          scamsentry analyze --text "Your account will be blocked. Verify now."
          scamsentry analyze --file examples\suspicious_message.txt
          scamsentry analyze --file examples\suspicious_message.txt --json
